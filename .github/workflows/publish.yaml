name: Release

on:
  push:
    branches:
      - main

# Principle of least privilege: default deny all permissions
permissions: {}

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false # Never abort an active release pipeline

jobs:
  release:
    name: Release & Publish
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # Avoid infinite loops from the version bump commit
    if: "!contains(github.event.head_commit.message, '[skip ci]')"
    permissions:
      contents: write       # Push version bump commits and git tags
      id-token: write       # Required for npm OIDC Trusted Publishing
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          token: ${{ secrets.RELEASE_TOKEN || secrets.GITHUB_TOKEN }}

      - name: Setup pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10

      - name: Setup Node.js
        uses: actions/setup-node@60edb5dd545a775178f52524783378180af0d1f8 # v4.2.0
        with:
          node-version: 22 # Node 22+ has built-in OIDC support for npm Trusted Publishing
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check for pending changesets
        id: check_changesets
        run: |
          CHANGESETS=$(ls .changeset/*.md 2>/dev/null | grep -v README.md || true)
          if [ -z "$CHANGESETS" ]; then
            echo "No changesets found — skipping release."
            echo "has_changesets=false" >> "$GITHUB_OUTPUT"
          else
            echo "Found changesets to release:"
            echo "$CHANGESETS"
            echo "has_changesets=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Version, Build & Publish via npm Trusted Publishing
        if: steps.check_changesets.outputs.has_changesets == 'true'
        env:
          NPM_CONFIG_PROVENANCE: true
        run: |
          # 1. Configure git user identity
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          # 2. Consume changesets, bump package versions, and update CHANGELOG.md
          pnpm changeset version

          # 3. Build packages with new version numbers
          pnpm build

          # 4. Publish packages via npm Trusted Publishing (OIDC)
          pnpm changeset publish --tag latest

          # 5. Commit version bump and push tags back to main
          git add -A
          if ! git diff --cached --quiet; then
            git commit -m "ci: version packages [skip ci]"
            git push --follow-tags origin HEAD:main
            echo "Successfully released and pushed version bump to main."
          else
            echo "No version changes to commit."
          fi
