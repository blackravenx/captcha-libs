name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

# Principle of least privilege: deny all permissions by default at workflow level
permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  verify:
    name: Lint, Test & Build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    if: "!contains(github.event.head_commit.message, '[skip ci]')"
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@fe02b34f77f8bc703788d5817da081398fad5dd2 # v4.0.0

      - name: Setup Node.js
        uses: actions/setup-node@60edb5dd545a775178f52524783378180af0d1f8 # v4.2.0
        with:
          node-version: 20
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Determine base git ref for affected filter
        id: filter-base
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            echo "base=origin/${{ github.base_ref }}" >> "$GITHUB_OUTPUT"
          else
            BEFORE="${{ github.event.before }}"
            if [ -n "$BEFORE" ] && [ "$BEFORE" != "0000000000000000000000000000000000000000" ]; then
              echo "base=$BEFORE" >> "$GITHUB_OUTPUT"
            else
              echo "base=HEAD~1" >> "$GITHUB_OUTPUT"
            fi
          fi

      - name: Lint affected packages
        run: pnpm turbo run lint --filter="...[${{ steps.filter-base.outputs.base }}]"

      - name: Run tests on affected packages
        run: pnpm turbo run test --filter="...[${{ steps.filter-base.outputs.base }}]"

      - name: Build affected packages
        run: pnpm turbo run build --filter="...[${{ steps.filter-base.outputs.base }}]"
