version: 2
updates:
  # Automated security & version updates for GitHub Actions (maintains commit SHA pinning)
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "ci"
      include: "scope"

  # Automated security & version updates for pnpm workspace dependencies
  - package-ecosystem: "pnpm"
    directory: "/"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "chore"
      include: "scope"
    open-pull-requests-limit: 10
